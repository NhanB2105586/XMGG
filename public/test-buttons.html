<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Buttons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Buttons</h1>
        
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <img src="/images/bosuutap/1.png" class="card-img-top" alt="Test Product">
                    <div class="card-body">
                        <h5 class="card-title">Sản phẩm test</h5>
                        <p class="card-text">Mô tả sản phẩm test</p>
                        <div class="d-flex justify-content-between gap-2">
                            <button class="btn btn-outline-danger add-favorite" data-product-id="1" style="flex: 1;">
                                Yêu thích
                            </button>
                            <button class="btn btn-primary add-to-cart" data-product-id="1" style="flex: 1;">
                                Thêm Vào Giỏ
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/script.js"></script>
    <script>
        console.log('Script loaded successfully');
        
        // Test event listeners
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            
            const favoriteButtons = document.querySelectorAll('.add-favorite');
            const cartButtons = document.querySelectorAll('.add-to-cart');
            
            console.log('Found favorite buttons:', favoriteButtons.length);
            console.log('Found cart buttons:', cartButtons.length);
            
            favoriteButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    console.log('Favorite button clicked');
                    e.preventDefault();
                    const productId = this.getAttribute('data-product-id');
                    console.log('Product ID:', productId);
                });
            });
            
            cartButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    console.log('Cart button clicked');
                    e.preventDefault();
                    const productId = this.getAttribute('data-product-id');
                    console.log('Product ID:', productId);
                });
            });
        });
    </script>
</body>
</html>
