<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Modal Bootstrap 4</h1>
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#testModal">
            Mở Modal Test
        </button>
    </div>

    <!-- Test Modal -->
    <div class="modal fade" id="testModal" tabindex="-1" role="dialog" aria-labelledby="testModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="testModalLabel">Test Modal</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Đây là modal test. Nút X phải hoạt động!</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    
    <script>
        $(document).ready(function() {
            console.log('jQuery loaded');
            console.log('Bootstrap modal test ready');
            
            // Test modal events
            $('#testModal').on('show.bs.modal', function () {
                console.log('Modal showing');
            });
            
            $('#testModal').on('shown.bs.modal', function () {
                console.log('Modal shown');
            });
            
            $('#testModal').on('hide.bs.modal', function () {
                console.log('Modal hiding');
            });
            
            $('#testModal').on('hidden.bs.modal', function () {
                console.log('Modal hidden');
            });
        });
    </script>
</body>
</html>
